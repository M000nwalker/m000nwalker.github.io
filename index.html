<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://mynurdoza.github.io/">
  <link rel="canonical" href="https://mynurdoza.github.io/">
  <title>Redirecting to Portfolio...</title>
  <script>
    (function () {
      var targetBase = "https://mynurdoza.github.io";
      var pathname = window.location.pathname;

      // Strip repository name prefix if hosted under m000nwalker.github.io/mynurdoza.github.io
      pathname = pathname.replace(/^\/mynurdoza\.github\.io/, "");

      // Ensure proper leading slash or empty string for root
      if (pathname.length > 0 && !pathname.startsWith("/")) {
        pathname = "/" + pathname;
      }

      var destination = targetBase + pathname + window.location.search + window.location.hash;
      window.location.replace(destination);
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding-top: 120px; background: #0b0f19; color: #f1f5f9;">
  <p style="font-size: 1.1rem;">Redirecting to K. M. Mynurdoza's Portfolio...</p>
  <p style="font-size: 0.9rem; color: #94a3b8;">If you are not redirected automatically, <a href="https://mynurdoza.github.io/" style="color: #38bdf8; text-decoration: none; font-weight: 600;">click here</a>.</p>
</body>
</html>
